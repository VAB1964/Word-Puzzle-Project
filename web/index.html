<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VAB Games</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-top: #1a1026;
        --bg-bottom: #090b14;
        --panel: #171b2f;
        --panel-border: #ffba5a;
        --panel-shadow: rgba(0, 0, 0, 0.45);
        --text-main: #f8f6f2;
        --text-muted: #dbcba9;
        --accent: #f59e0b;
        --accent-hover: #fbbf24;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", "Trebuchet MS", Arial, sans-serif;
        color: var(--text-main);
        background: radial-gradient(circle at top, var(--bg-top), var(--bg-bottom) 65%);
      }

      .page {
        width: min(1100px, 100% - 2rem);
        margin: 0 auto;
        padding: 2.5rem 0 3rem;
      }

      .title-wrap {
        text-align: center;
        margin-bottom: 2rem;
      }

      h1 {
        margin: 0;
        letter-spacing: 0.08em;
        font-size: clamp(2rem, 5vw, 3.5rem);
        text-transform: uppercase;
      }

      .subtitle {
        margin: 0.75rem auto 0;
        max-width: 38rem;
        color: var(--text-muted);
        font-size: clamp(1rem, 2.2vw, 1.2rem);
      }

      .games-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1.5rem;
      }

      .game-tile {
        display: flex;
        flex-direction: column;
        border: 2px solid var(--panel-border);
        border-radius: 1rem;
        background: linear-gradient(160deg, #20284b, var(--panel));
        box-shadow: 0 14px 30px var(--panel-shadow);
        padding: 1.25rem;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }

      .game-tile:hover,
      .game-tile:focus-within {
        transform: translateY(-4px);
        box-shadow: 0 20px 36px rgba(0, 0, 0, 0.55);
        border-color: var(--accent-hover);
      }

      .tile-icon {
        width: 100%;
        min-height: 180px;
        border-radius: 0.75rem;
        margin-bottom: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: #111527;
        position: relative;
        overflow: hidden;
      }

      .icon-wordpuzzle::before,
      .icon-wordpuzzle::after {
        content: "";
        position: absolute;
        inset: 14% 10%;
        border-radius: 0.5rem;
      }

      .icon-wordpuzzle::before {
        background:
          linear-gradient(90deg, transparent 24%, rgba(255, 255, 255, 0.25) 24% 26%, transparent 26% 49%, rgba(255, 255, 255, 0.25) 49% 51%, transparent 51% 74%, rgba(255, 255, 255, 0.25) 74% 76%, transparent 76%),
          linear-gradient(transparent 24%, rgba(255, 255, 255, 0.25) 24% 26%, transparent 26% 49%, rgba(255, 255, 255, 0.25) 49% 51%, transparent 51% 74%, rgba(255, 255, 255, 0.25) 74% 76%, transparent 76%),
          linear-gradient(135deg, rgba(245, 158, 11, 0.45), rgba(99, 102, 241, 0.35));
      }

      .icon-wordpuzzle::after {
        content: "W O R D";
        display: grid;
        place-items: center;
        font-weight: 700;
        letter-spacing: 0.35em;
        color: #fff6e8;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.65);
        inset: 30% 14%;
        border: 2px solid rgba(255, 241, 220, 0.55);
        background: rgba(15, 20, 35, 0.55);
      }

      .icon-cribbage::before,
      .icon-cribbage::after {
        content: "";
        position: absolute;
        width: 40%;
        aspect-ratio: 3 / 4;
        border-radius: 0.75rem;
        top: 18%;
        box-shadow: 0 10px 16px rgba(0, 0, 0, 0.4);
      }

      .icon-cribbage::before {
        left: 18%;
        background: linear-gradient(150deg, #fff2d8, #eac890);
        transform: rotate(-9deg);
      }

      .icon-cribbage::after {
        right: 18%;
        background: linear-gradient(150deg, #fff3f3, #f3b2b2);
        transform: rotate(9deg);
      }

      .icon-cribbage span {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: clamp(2rem, 6vw, 3rem);
        z-index: 1;
      }

      h2 {
        margin: 0;
        font-size: clamp(1.35rem, 3vw, 1.8rem);
      }

      .tile-text {
        color: var(--text-muted);
        margin: 0.6rem 0 1.2rem;
        line-height: 1.45;
      }

      .play-button {
        margin-top: auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
        border-radius: 0.7rem;
        text-decoration: none;
        font-size: 1rem;
        font-weight: 700;
        color: #1b1200;
        background: linear-gradient(180deg, var(--accent-hover), var(--accent));
        border: 1px solid rgba(0, 0, 0, 0.3);
        transition: filter 0.2s ease, transform 0.2s ease;
      }

      .play-button:hover,
      .play-button:focus-visible {
        filter: brightness(1.08);
        transform: translateY(-1px);
      }

      .play-button:focus-visible {
        outline: 3px solid #fef3c7;
        outline-offset: 2px;
      }

      @media (max-width: 900px) {
        .games-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="title-wrap">
        <h1>VAB Games</h1>
        <p class="subtitle">Choose a game room and start playing.</p>
      </section>

      <section class="games-grid" aria-label="Game Selection">
        <article class="game-tile">
          <div class="tile-icon icon-wordpuzzle" aria-hidden="true"></div>
          <h2>WordPuzzle</h2>
          <p class="tile-text">Find hidden words, build streaks, and sharpen your vocabulary.</p>
          <a class="play-button" href="/wordpuzzle/" aria-label="Play WordPuzzle">
            <span>Play</span>
          </a>
        </article>

        <article class="game-tile">
          <div class="tile-icon icon-cribbage" aria-hidden="true"><span>♣♦</span></div>
          <h2>Cribbage Card Room</h2>
          <p class="tile-text">Head to the card room for classic cribbage matches and score battles.</p>
          <a
            class="play-button"
            href="https://cribbage-game.vincebr.chatgpt.site"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Play Cribbage Card Room"
          >
            <span>Play</span>
          </a>
        </article>
      </section>
    </main>
  </body>
</html>
